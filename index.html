<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stato: Occupato</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212; /* Sfondo scuro per non affaticare la vista */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 10px;
            color: #ff4b2b; /* Rosso per indicare l'indisponibilità */
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚫</div>
        <h1>Occupato</h1>
        <p>Ti risponderò appena possibile.</p>
    </div>

</body>
</html>
